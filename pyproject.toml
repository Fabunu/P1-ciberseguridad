[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "sbom-analysis"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "jupyterlab",
    "pandas",
    "ipywidgets",
    "matplotlib",
    "pyarrow>=24.0.0",
    "jupyter>=1.1.1",
    "ipykernel>=7.2.0",
]

[tool.setuptools]
packages = ["miner", "analyzer", "visualizer"]

[tool.setuptools.package-dir]
"" = "."
